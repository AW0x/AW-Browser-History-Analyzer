<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Privacy-first Browser History Analyzer — import, explore, and visualize your browser history entirely on your device." />
		<meta name="theme-color" content="#f5f0e8" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<script>
			// Prevent theme flash: apply persisted/system theme before paint.
			(function () {
				try {
					const stored = localStorage.getItem('cha:theme');
					const system =
						window.matchMedia &&
						window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
					const theme = stored === 'dark' || stored === 'light' ? stored : system;
					document.documentElement.dataset.theme = theme;
				} catch {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
